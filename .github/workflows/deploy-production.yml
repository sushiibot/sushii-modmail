name: Promote Production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: "Successful completed staging CI run ID (from its GitHub URL)"
        required: true
        type: string

permissions: {}

jobs:
  promote:
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/release-promote.yml@8458e0588e5f938593046713faef1939fedd5f05 # release presets
    with:
      staging_run_id: ${{ inputs.staging_run_id }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
